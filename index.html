<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сохранение данных</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ввод данных</h1>
        
        <div class="chat-window">
            <div class="message bot">
                Привет! Введи свои данные в формате:<br>
                <strong>Ник Почта Телефон</strong><br>
                (через пробел или с новой строки)
            </div>
            
            <textarea id="input" placeholder="Например: Иван ivan@example.com +79161234567" rows="6"></textarea>
            
            <button onclick="sendData()">Отправить</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

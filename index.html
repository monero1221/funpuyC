<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>funpay • Поддержка</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>FUNPAY<span class="ru">.RU</span></h1>
      <div class="status-dot">
        <span class="green"></span> Undetected
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="main">Главная</button>
    <button class="tab-btn" data-tab="support">Поддержка</button>
  </div>

  <!-- Главная вкладка -->
  <div id="main" class="tab-content active">
    <div class="terminal-container">
      <div class="terminal-header">
        <div class="dots">
          <span class="red"></span>
          <span class="yellow"></span>
          <span class="green"></span>
        </div>
        <span>root@funpayABYS:~#</span>
      </div>
      <div class="terminal-body">
        <p>Добро пожаловать </p>
        <p>Выберите раздел "Поддержка" для отправки сообщения в общий канал.</p>
      </div>
    </div>
  </div>

  <!-- Вкладка Поддержка -->
  <div id="support" class="tab-content">
    <div class="terminal-container">
      <div class="terminal-header">
        <div class="dots">
          <span class="red"></span>
          <span class="yellow"></span>
          <span class="green"></span>
        </div>
        <span>Отправка Модеру • Общее</span>
      </div>
      <div class="terminal-body">
        <textarea id="message" placeholder="Напишите ваше сообщение здесь..."></textarea>
        
        <button id="sendBtn">Отправить сообщение</button>
        
        <div id="status"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
